version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tabitabe_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tabitabe_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"  # Changed from 5432 to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tabitabe_network

  # Redis (Cache + Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: tabitabe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tabitabe_network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: tabitabe_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"  # API - Changed from 9000 to avoid conflict
      - "9003:9001"  # Console - Changed from 9001 to avoid conflict
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tabitabe_network

  # MinIO Client (Create buckets on startup)
  minio-init:
    image: minio/mc:latest
    container_name: tabitabe_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/tabitabe-media --ignore-existing;
      /usr/bin/mc mb myminio/tabitabe-public --ignore-existing;
      /usr/bin/mc anonymous set download myminio/tabitabe-public;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - tabitabe_network

  # Keycloak (OIDC/OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: tabitabe_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tabitabe_dev}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command:
      - start-dev
      - --import-realm
    ports:
      - "8081:8080"  # Changed from 8080 to avoid conflict
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tabitabe_network

  # Django Backend (Uncomment when ready)
